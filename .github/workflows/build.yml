
name: Build Melody APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract original project
        run: |
          mkdir extracted
          unzip -q MelodyAndroidCloudBuild.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          echo "Building from $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
